<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05000d">
<title>Find Me — In 7 Billion People</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05000d;font-family:Inter,system-ui,sans-serif}
body{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-align:center}
.title{position:absolute;top:max(28px,env(safe-area-inset-top));left:0;right:0;font-family:Georgia,serif;font-size:clamp(22px,6vw,42px);letter-spacing:.08em;text-shadow:0 0 18px #ff4f9a}
.hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:16px;right:16px;font-size:13px;opacity:.75;line-height:1.5}
.letterBtn{pointer-events:auto;position:absolute;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 70px));transform:translateX(-50%) scale(.7);opacity:0;border:1px solid rgba(255,255,255,.35);background:rgba(255,80,140,.15);backdrop-filter:blur(12px);color:#fff;border-radius:50%;width:64px;height:64px;font-size:27px;cursor:pointer;transition:.45s}
.letterBtn.show{opacity:1;transform:translateX(-50%) scale(1)}
.modal{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:rgba(0,0,12,.58);backdrop-filter:blur(8px);z-index:5}
.modal.show{display:grid}
.card{max-width:440px;width:100%;padding:30px 24px;border:1px solid rgba(255,255,255,.22);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,70,130,.07));box-shadow:0 20px 70px rgba(0,0,0,.45);color:#fff;text-align:center}
.card h2{font-family:Georgia,serif;font-size:32px;margin:0 0 14px}
.card p{font-family:Georgia,serif;font-size:18px;line-height:1.7;margin:0}
.close{margin-top:22px;padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:white}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="title">Find Me</div>
  <div class="hint" id="hint">Drag either glowing soul toward the other ✨</div>
  <button class="letterBtn" id="letterBtn" aria-label="Open love letter">💌</button>
</div>
<div class="modal" id="modal">
  <div class="card">
    <h2>Dear Love ❤️</h2>
    <p>Out of billions of people, somehow two souls found each other.<br><br>
    Maybe some things really are written in the stars.</p>
    <button class="close" id="close">Close</button>
  </div>
</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const hint=document.getElementById('hint'),letterBtn=document.getElementById('letterBtn');
const modal=document.getElementById('modal'),close=document.getElementById('close');
let W,H,dpr,merged=false,drag=null,last=performance.now();

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize,{passive:true}); resize();

const stars=Array.from({length:170},()=>({
 x:Math.random(),y:Math.random(),r:Math.random()*1.4+.2,a:Math.random(),s:Math.random()*1.5+.3
}));
const petals=[];
const hearts=[];
const A={x:.27,y:.52,tx:.27,ty:.52,color:[255,105,180]};
const B={x:.73,y:.52,tx:.73,ty:.52,color:[255,65,75]};

function burst(x,y){
 for(let i=0;i<55;i++){
  const a=Math.random()*Math.PI*2, v=30+Math.random()*130;
  hearts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,life:1});
 }
 for(let i=0;i<35;i++) petals.push({
   x:Math.random()*W,y:-Math.random()*H*.5,
   vx:(Math.random()-.5)*22,vy:20+Math.random()*45,
   rot:Math.random()*6,vr:(Math.random()-.5)*2
 });
}

function setSoul(s,p){s.tx=p.x/W;s.ty=p.y/H}
function pos(s){return{x:s.tx*W,y:s.ty*H}}
function pointer(e){
 const r=canvas.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function down(e){
 e.preventDefault();
 const p=pointer(e),a=pos(A),b=pos(B);
 if(dist(p,a)<70) drag=A;
 else if(dist(p,b)<70) drag=B;
 if(drag) canvas.setPointerCapture?.(e.pointerId);
}
function move(e){
 if(!drag)return;
 e.preventDefault();
 setSoul(drag,pointer(e));
}
function up(e){
 drag=null;
}
canvas.addEventListener('pointerdown',down);
canvas.addEventListener('pointermove',move);
canvas.addEventListener('pointerup',up);
canvas.addEventListener('pointercancel',up);

function heartPath(cx,cy,scale){
 ctx.beginPath();
 for(let t=0;t<=Math.PI*2+.03;t+=.03){
   const x=16*Math.pow(Math.sin(t),3);
   const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
   const px=cx+x*scale,py=cy+y*scale;
   t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
 }
 ctx.closePath();
}

function drawSoul(s,label){
 const p=pos(s),g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,70);
 const c=s.color.join(',');
 g.addColorStop(0,`rgba(${c},1)`);g.addColorStop(.15,`rgba(${c},.65)`);
 g.addColorStop(1,`rgba(${c},0)`);
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,70,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.shadowBlur=20;ctx.shadowColor=`rgb(${c})`;
 ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.fillText(label,p.x,p.y+30);
}

function draw(){
 const now=performance.now(),dt=Math.min((now-last)/1000,.04);last=now;
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.max(W,H)*.8);
 bg.addColorStop(0,'#15061d');bg.addColorStop(1,'#020006');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 stars.forEach(s=>{
   s.a += dt*s.s;
   ctx.globalAlpha=.25+.55*(.5+.5*Math.sin(s.a));
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill();
 });
 ctx.globalAlpha=1;

 A.tx+=(A.tx-A.x)*0.02; B.tx+=(B.tx-B.x)*0.02;
 // x/y are used as previous targets; smooth movement with tx/ty
 A.x += (A.tx-A.x)*Math.min(1,dt*10); A.y += (A.ty-A.y)*Math.min(1,dt*10);
 B.x += (B.tx-B.x)*Math.min(1,dt*10); B.y += (B.ty-B.y)*Math.min(1,dt*10);

 // Correct normalized state after pointer movement
 const ap={x:A.tx*W,y:A.ty*H},bp={x:B.tx*W,y:B.ty*H};
 const d=dist(ap,bp);
 if(!merged && d<Math.min(W,H)*.13){
   merged=true; burst((ap.x+bp.x)/2,(ap.y+bp.y)/2);
   hint.textContent='You found each other ❤️ Tap the letter';
   letterBtn.classList.add('show');
 }
 if(merged){
   const cx=(ap.x+bp.x)/2,cy=(ap.y+bp.y)/2;
   ctx.save();heartPath(cx,cy,Math.min(W,H)/115);
   ctx.strokeStyle='rgba(255,40,90,.9)';ctx.lineWidth=3;ctx.shadowBlur=24;ctx.shadowColor='#ff2d63';
   ctx.stroke();ctx.fillStyle='rgba(220,20,60,.35)';ctx.fill();ctx.restore();
 }
 if(!merged && d<Math.min(W,H)*.38){
   const g=ctx.createLinearGradient(ap.x,ap.y,bp.x,bp.y);
   g.addColorStop(0,'rgba(255,105,180,.1)');g.addColorStop(.5,'rgba(255,70,110,.8)');g.addColorStop(1,'rgba(255,60,60,.1)');
   ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ap.x,ap.y);ctx.lineTo(bp.x,bp.y);ctx.stroke();
 }
 if(!merged){drawSoul(A,'YOU');drawSoul(B,'ME');}

 hearts.forEach((h,i)=>{
   h.x+=h.vx*dt;h.y+=h.vy*dt;h.vy+=18*dt;h.life-=dt*.55;
   ctx.globalAlpha=Math.max(0,h.life);ctx.fillStyle='#ff4f91';
   ctx.font='18px serif';ctx.fillText('♥',h.x,h.y);
   if(h.life<=0)hearts.splice(i,1);
 });
 petals.forEach((p,i)=>{
   p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=.65;
   ctx.fillStyle='#ff6fa8';ctx.beginPath();ctx.ellipse(0,0,4,8,0,0,Math.PI*2);ctx.fill();ctx.restore();
   if(p.y>H+20)petals.splice(i,1);
 });
 ctx.globalAlpha=1;
 requestAnimationFrame(draw);
}
draw();

letterBtn.onclick=()=>modal.classList.add('show');
close.onclick=()=>modal.classList.remove('show');
modal.addEventListener('pointerdown',e=>{if(e.target===modal)modal.classList.remove('show')});
</script>
</body>
</html>
